services:
  - type: web
    name: inventario-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma migrate deploy --schema=./prisma/schema.prisma && npx prisma generate --schema=./prisma/schema.prisma && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - fromSecret: POSTGRES_URL
        key: DATABASE_URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 24h
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        value: https://inventario-casa-renta.vercel.app
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: UPLOAD_PATH
        value: /data/uploads
      - key: MAINTENANCE_AUTO_BACKUP
        value: false
    disks:
      - name: data
        mountPath: /data
