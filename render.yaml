services:
  - type: web
    name: inventario-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: 'npm install && npm run build && npx prisma migrate deploy'
    startCommand: 'npm run start:prod'
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: neondb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 24h
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        value: https://inventario-casa-renta.vercel.app
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: UPLOAD_PATH
        value: ./uploads

databases:
  - name: neondb
    databaseName: neondb
    ipAllowList: []
