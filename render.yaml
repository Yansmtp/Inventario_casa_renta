services:
  - type: web
    name: inventario-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install --include=dev && npx tsc -p tsconfig.json
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_LwAsFibv0TW5@ep-delicate-credit-ay3vyhzk-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 24h
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        value: https://inventario-casa-renta.vercel.app
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: UPLOAD_PATH
        value: ./uploads
